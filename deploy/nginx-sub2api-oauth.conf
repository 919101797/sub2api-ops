# OAuth 提供商回到 sub2api 后，只将由 ops 发起的回调分流到运维服务。
# Cookie 由 /ops/api/auth/oauth/:provider/start 设置，HttpOnly 且 10 分钟失效。
location = /auth/oauth/callback {
    error_page 418 = @ops_oauth_callback;
    if ($cookie_sub2api_ops_oauth != "") { return 418; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://sub2api_backend;
}

location @ops_oauth_callback {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://sub2api_ops_backend;
}
