# 在 rewrite 阶段按 Upgrade 请求头分流：HTTP 使用后台 mirror，WS 交给独立审计 Relay。
location = /v1/responses {
    error_page 418 = @ops_responses_http;
    error_page 419 = @ops_responses_ws;
    if ($http_upgrade != "") { return 419; }
    return 418;
}

# HTTP 主链路保持原有代理参数，镜像子请求的返回值不参与主请求响应。
location @ops_responses_http {
    mirror /_ops_prompt_capture;
    mirror_request_body on;

    # HTTP 出口协商压缩；审计与 Sub2API 仍处理原文，SSE 按 flush 即时发送。
    gzip on;
    gzip_comp_level 3;
    gzip_min_length 0;
    gzip_types text/event-stream application/json;
    gzip_proxied any;
    gzip_vary on;
    postpone_output 0;
    tcp_nodelay on;
    proxy_set_header Accept-Encoding "";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_ops;

    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_pass http://sub2api_backend;
}

location @ops_responses_ws {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_ops;

    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_pass http://127.0.0.1:__WS_RELAY_HOST_PORT__;
}

# 非 POST 请求只在内部返回 204；WS 帧由 Relay 逐消息持久化，不进入 HTTP mirror。
location = /_ops_prompt_capture {
    internal;
    if ($request_method != POST) { return 204; }
    if ($http_upgrade != "") { return 204; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header X-Original-Authorization $http_authorization;
    proxy_set_header X-Original-API-Key $http_x_api_key;
    proxy_set_header X-Original-Session-ID $http_x_session_id;
    proxy_set_header X-Original-Conversation-ID $http_x_conversation_id;
    proxy_set_header Content-Type application/x-sub2api-prompt-capture;
    proxy_set_header X-Ops-Capture-Secret __CAPTURE_SECRET__;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Original-URI $request_uri;
    proxy_connect_timeout 100ms;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    proxy_next_upstream off;

    proxy_pass http://sub2api_ops_backend/internal/prompts/capture;
}
