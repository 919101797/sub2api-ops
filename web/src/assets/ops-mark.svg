<svg xmlns="http://www.w3.org/2000/svg" class="ops-logo" viewBox="0 0 64 64" fill="none" color="#e7bb91">
  <title>Sub2API Ops · 折光</title>
  <style>
    @media(prefers-color-scheme:light){.ops-logo{color:#654832}}
    .ops-ribbon{transform-origin:32px 32px;transition:transform .65s cubic-bezier(.18,.8,.2,1)}
    .ops-ribbon-face{opacity:.26;animation:ops-reflection 7s ease-in-out infinite}
    .ops-ribbon-edge{stroke-dasharray:20 105;stroke-dashoffset:20;animation:ops-edge-light 7s ease-in-out infinite}
    .ops-logo:hover .ops-ribbon{transform:translateY(-1px) rotate(-3deg)}
    @keyframes ops-reflection{0%,65%,100%{opacity:.16}35%{opacity:.58}}
    @keyframes ops-edge-light{0%,12%{stroke-dashoffset:20;opacity:0}30%{opacity:.8}58%,100%{stroke-dashoffset:-105;opacity:0}}
    @media(prefers-reduced-motion:reduce){.ops-ribbon-face,.ops-ribbon-edge{animation:none}.ops-ribbon{transition:none}.ops-logo:hover .ops-ribbon{transform:none}}
  </style>
  <g class="ops-ribbon">
    <path d="M52 10H28C16 10 9 16 9 26C9 33 13 37 22 40L38 45H10L18 54H36C48 54 55 48 55 38C55 31 51 27 42 24L26 19H44L52 10Z" fill="currentColor"/>
    <path class="ops-ribbon-face" d="M12.2 19.1C11.1 25.6 14.7 29.4 23 32L39 37C47.6 39.8 51.8 42.7 51.8 47.6C49 51.7 43.4 54 36 54H18L10 45H38L22 40C13 37 9 33 9 26C9 23.3 10.1 20.9 12.2 19.1Z" fill="#080b10"/>
    <path d="M13 23.5C14 27.1 17.2 29.5 23.8 31.7L39.4 36.8C45.6 38.8 49.3 41.4 50.5 44.8" stroke="currentColor" stroke-width=".75" opacity=".36"/>
    <path class="ops-ribbon-edge" d="M45 14.5H28C19 14.5 13.5 18.6 13.5 25C13.5 29.7 17.5 32.7 25 35L39 39.5C46 41.7 49 44 48 47" stroke="#fff7ec" stroke-width="1.25" stroke-linecap="round"/>
  </g>
</svg>
